<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>任务摘要</title>
<style>/*__CSS__*/</style>
</head>
<body>
<div id="tdigest-root">
  <div class="wrap">
    <div class="panel" id="tdigest-panel" data-view="overview">
      <div class="overview">
        <div class="head">
          <div class="eyebrow"><span>Task Digest</span><span class="live"><i></i>只读</span></div>
          <h1>任务摘要</h1>
          <div class="seg" role="group" aria-label="时间范围">
            <button type="button" data-range="today" aria-pressed="false">今日</button>
            <button type="button" data-range="3d" aria-pressed="false">近 3 天</button>
            <button type="button" data-range="all" aria-pressed="true">全部</button>
          </div>
        </div>
        <div class="metrics" id="tdigest-metrics"></div>
        <div class="chart">
          <div class="chart-head"><span class="lbl">每日 token</span><span class="peak" id="tdigest-peak"></span></div>
          <div class="bars" id="tdigest-bars"></div>
          <div class="axis"><span id="tdigest-from"></span><span id="tdigest-to"></span></div>
        </div>
        <div class="list-head"><b>最近任务</b><span id="tdigest-count"></span></div>
        <div class="rows" id="tdigest-rows"><div id="tdigest-body"></div></div>
        <div class="foot"><span class="muted">tasks-index · session · 只读</span><code></code></div>
      </div>
      <div class="detail">
        <div class="dwrap">
          <button type="button" class="back" id="tdigest-back"><span aria-hidden="true">←</span> 返回</button>
          <div class="d-title" id="tdigest-dtitle"></div>
          <div class="d-sub" id="tdigest-dsub"></div>
          <div class="kv" id="tdigest-kv"></div>
          <div class="sub-h">工具调用</div>
          <div class="tl" id="tdigest-tools"></div>
          <div class="sub-h">待办</div>
          <div class="tdl" id="tdigest-todos"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>/*__JS__*/</script>
</body>
</html>
